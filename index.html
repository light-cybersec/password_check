<!DOCTYPE html>
<html lang ="en">
<head>
  <meta charset="UTF-8">
  <title> ~Password Checker~ </title>

  <style>
    :root {
      --bg: #201d3e;
      --panel: #74719d;
      --text: #f5dbdb;
      --accent: #85d0e7;
      --accent-dark: #790c0c;
    }

    * {box-sizing: border-box;}

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg), var(--panel));
      color: var(--text);
      font-family: 'Poppins', sans-serif;}

      .panel {
        background: var(--panel);
        padding: 2rem;
        border-radius: 16px;
        width: min(420px, 90%);
        box-shadow: 0 10px 10px rgba(5, 27, 42, 0.5);
        text-align: center;
        animation: fadeIn 1s ease-in-out;}

      h1{
        font-size: 2rem;
        margin-bottom: 1rem;}

      
        input {
          width: 100%;
          padding: 0.8rem 1rem;
          border-radius: 10px;
          border: 2px solid transparent;
          background: var(--bg);
          color: var(--text);
          font-size: 1rem;
          outline: none;
          transition: border-color 0.3s box-shadow 0.2s;} 

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 4px var(--accent-dark);}

          
        button {
          margin-top: 1rem;
          padding: 0.7rem 2rem;
          border: none;
          border-radius: 10px;
          background: var(--accent);
          color: #0f172a;
          font-size: 1rem;
          font-weight: 600;
          cursor: pointer;
          transition: transform 0.15s, background 0.2s;}


        button:hover {
          background: var(--accent-dark);
          transform: translateY(-2px);}

        
          button:active { transform: translateY(0); }

/* strength bar, control the width and color with JS later */
    .bar {
      height: 8px;
      margin-top: 1.2rem;
      border-radius: 99px;
      background: #0f172a;
      overflow: hidden;
    }

    #bar-fill {
      height: 100%;
      width: 0%;
      background: #1e1449;
      transition: width 0.4s, background 0.4s;
    }

    #result {
      min-height: 1.5em;
      margin-top: 1rem;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to   { opacity: 1; transform: translateY(0); }
    }

  </style>



</head>


<body>
  <div class = "panel">
    <h1> Let's see how strong your password actually is! </h1>
  
    <input type="password" id="password" placeholder="Please type your password here.. ">
  
    <button id="check">Check</button>

    <div class="bar"><div id="bar-fill"></div></div>
  
    <p id="result"></p>
  </div>

  <script>
// The logic of checking password here 


  
  </script>


</body>
</html>
